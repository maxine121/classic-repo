<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="classic.css" />
    <link rel="icon" href="https://cdn.discordapp.com/emojis/1391222881920356444.webp?size=96">
    <title>CLASSIC SITE</title>
</head>
<body>
        <div id="easter-egg"></div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="francisco-botoes">
        <img src="./assets/blinkiesCafe-GH.gif" id="botao-italo" />
        <img src="./assets/manoel_na_área1.gif" id="botao-manoel" />
        <img src="./assets/apendiceDeOtavio.gif" id="botao-otavio"/>
        <img src="https://blinkies.cafe/b/display/blinkiesCafe-badge.gif" id="botao-fabio">
        <button id="botao-caio">Caio alert</button>
    </div>
    <div class="francisco-imagens">

    </div>
    <form id="canto-easter-egg">
        <h2 id="easter-mensagem">Bem vindo ao cantinho dos easter eggs! Digite o código certo e quem sabe poderá ver por trás do véu?</h2>
        <input id="input-easter-egg" placeholder="Digite a senha" />
        <button type="submit" id="confirmar">Enviar</button>
    </form>
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 50px;">
        <h2 style="color: white">Pergunta pra mim!</h2>
        <img src="./assets/Franciscao.webp" />
        <h1 style="color: purple">Pergunte a FRANCISCÃO!</h1>
        <input style="margin-bottom: 20px;" id="pergunta-input" placeholder="Faça sua pergunta...">
        <button type="submit" id="perguntar">Perguntar</button>
        <h1 style="color: white" id="resposta"></h1>
    </div>
    <script src="classic.js"></script>
</body>
</html>
